<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sovereignty Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1e1e1e;
      color: #ffffff;
    }

    h2 {
      font-size: 18px;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      border: 1px solid #333;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #dc2626;
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .stat-card.allowed .stat-value {
      color: #10b981;
    }

    .requests-section {
      margin-bottom: 16px;
    }

    .section-header {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .request-list {
      max-height: 200px;
      overflow-y: auto;
      background: #2a2a2a;
      border-radius: 6px;
      padding: 8px;
      border: 1px solid #333;
    }

    .request-list::-webkit-scrollbar {
      width: 6px;
    }

    .request-list::-webkit-scrollbar-track {
      background: #1e1e1e;
      border-radius: 3px;
    }

    .request-list::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .request-list::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .request-item {
      font-size: 11px;
      padding: 8px;
      border-bottom: 1px solid #333;
      word-break: break-all;
    }

    .request-item:last-child {
      border-bottom: none;
    }

    .request-url {
      color: #667eea;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .request-meta {
      color: #666;
      font-size: 10px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      background: #444;
      border-color: #555;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      background: #667eea;
      border-color: #667eea;
    }

    .primary:hover {
      background: #5568d3;
      border-color: #5568d3;
    }

    .empty {
      text-align: center;
      padding: 24px;
      color: #666;
      font-size: 12px;
    }

    .session-time {
      font-size: 10px;
      color: #666;
      text-align: center;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 4px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <h2>
    <span class="status-indicator"></span>
    Sovereignty Monitor
  </h2>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="blocked-count">0</div>
      <div class="stat-label">Blocked</div>
    </div>
    <div class="stat-card allowed">
      <div class="stat-value" id="allowed-count">0</div>
      <div class="stat-label">Allowed</div>
    </div>
  </div>

  <div class="requests-section">
    <div class="section-header">Recently Blocked</div>
    <div class="request-list" id="blocked-list">
      <div class="empty">No requests blocked yet</div>
    </div>
  </div>

  <div class="buttons">
    <button id="clear-stats">Clear Stats</button>
    <button class="primary" id="open-options">Manage Rules</button>
  </div>

  <div class="session-time" id="session-time">Session: 0m</div>

  <script src="popup.js"></script>
</body>
</html>
